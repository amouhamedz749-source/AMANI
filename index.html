
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>AMANI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{background:#18263b;padding:28px 18px;text-align:center}
h1{font-size:38px;color:#54e0b5;margin:5px}
header p{color:#c4d0df}
main{padding:20px;max-width:600px;margin:auto}
.card{background:#1b2b42;padding:20px;border-radius:16px;margin:15px 0}
h2{color:#54e0b5}
button{background:#54e0b5;color:#102033;border:0;border-radius:10px;padding:12px 20px;font-size:16px;font-weight:bold}
input,textarea{width:100%;padding:13px;margin:8px 0;border:0;border-radius:9px;font-size:16px}
footer{text-align:center;color:#9aabc0;padding:25px}
</style>
</head>
<body>
<header>
<h1>AMANI</h1>
<p>مرحبا بك في تطبيق أماني</p>
</header>
<main>
<div class="card">
<h2>أهلاً وسهلاً بك ❤️</h2>
<p>تطبيق AMANI مساحة بسيطة للتواصل ومشاركة الأفكار.</p>
</div>
<div class="card">
<h2>عن صاحب التطبيق</h2>
<p>تم إنشاء هذا التطبيق بواسطة أماني بوزيان.</p>
</div>
<div class="card">
<h2>اترك رسالتك</h2>
<input id="name" placeholder="اسمك">
<textarea id="message" placeholder="اكتب رسالتك هنا"></textarea>
<button onclick="sendMessage()">إرسال</button>
<p id="result"></p>
</div>
</main>
<footer>© AMANI 2026</footer>
<script>
function sendMessage(){
let n=document.getElementById('name').value.trim();
let m=document.getElementById('message').value.trim();
if(!n||!m){document.getElementById('result').innerText='أكمل المعلومات أولاً';return;}
document.getElementById('result').innerText='شكراً '+n+' ❤️';
}
</script>
</body>
</html>
